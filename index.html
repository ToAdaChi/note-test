<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FISHING NOTE">
<meta name="theme-color" content="#111111">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<title>釣果ノート</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* アパレルのルックブックのように白と黒だけで組み、色はHITの赤だけ。中央に大きなHIT、下にタブ、詳細は下から出るシート。 */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --ink:#111111; --muted:#707070; --line:#E3E3E3;
  --accent:#111111; --accent-text:#111111;
  --btn-bg:#111111; --btn-ink:#FFFFFF;
  --hit-bg:#D7261E; --hit-ink:#FFFFFF; --hit-deep:#8F1712;
  --sea:#111111; --sea-soft:#F0F0F0; --warn:#D7261E; --scrim:rgba(0,0,0,.45);
  --f-display:"Jost","Zen Kaku Gothic New","Hiragino Sans",sans-serif;
  --f-body:"Jost","Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-num:"Jost","Futura","Avenir Next",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E0E0E; --surface:#0E0E0E; --ink:#F2F2F2; --muted:#9A9A9A; --line:#2C2C2C;
  --accent:#F2F2F2; --accent-text:#F2F2F2;
  --btn-bg:#F2F2F2; --btn-ink:#0E0E0E;
  --hit-bg:#E5322A; --hit-ink:#FFFFFF; --hit-deep:#7E120D;
  --sea:#F2F2F2; --sea-soft:#262626; --warn:#FF6B63; --scrim:rgba(0,0,0,.65); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E0E0E; --surface:#0E0E0E; --ink:#F2F2F2; --muted:#9A9A9A; --line:#2C2C2C;
  --accent:#F2F2F2; --accent-text:#F2F2F2;
  --btn-bg:#F2F2F2; --btn-ink:#0E0E0E;
  --hit-bg:#E5322A; --hit-ink:#FFFFFF; --hit-deep:#7E120D;
  --sea:#F2F2F2; --sea-soft:#262626; --warn:#FF6B63; --scrim:rgba(0,0,0,.65); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;-webkit-tap-highlight-color:transparent;text-align:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
h2{font-family:var(--f-display);font-size:17px;margin:0;font-weight:500;text-wrap:balance;letter-spacing:.1em}
h3{font-family:var(--f-display);font-size:14px;margin:0;font-weight:500;letter-spacing:.1em}
p{margin:0}
.app{max-width:520px;margin:0 auto;min-height:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:10px calc(92px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:flex-end;justify-content:space-between;padding-block:8px 12px;margin-bottom:18px;border-bottom:1px solid var(--ink)}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:22px;height:22px;color:var(--hit-bg);flex:none}
.brand-name{display:flex;flex-direction:column;line-height:1.2}
.brand-name b{font-family:var(--f-display);font-size:17px;font-weight:500;letter-spacing:.22em;white-space:nowrap}
.brand-name small{font-size:10px;letter-spacing:.3em;color:var(--muted)}
.proto{font-size:10px;letter-spacing:.16em;color:var(--ink);border:1px solid var(--ink);padding:1px 6px;margin-bottom:4px;white-space:nowrap}
.eyebrow{font-size:10px;letter-spacing:.2em;color:var(--muted);font-weight:500}
.muted{color:var(--muted)}
.hint{font-size:12px;color:var(--muted)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:2px;padding:18px 16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.pill{display:inline-flex;align-items:center;font-size:11px;font-weight:500;padding:2px 10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);letter-spacing:.1em}
.tag{display:inline-block;font-size:9px;font-weight:500;letter-spacing:.14em;padding:1px 6px;border:1px solid var(--muted);color:var(--muted);margin-left:6px;vertical-align:2px}

.btn-primary{display:flex;align-items:center;justify-content:center;width:100%;min-height:58px;border-radius:2px;background:var(--btn-bg);color:var(--btn-ink);font-family:var(--f-display);font-weight:500;font-size:15px;letter-spacing:.24em}
.btn-primary.big{min-height:88px;font-size:18px}
.btn-primary:active{opacity:.85}
.btn-ghost{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:2px;border:1px solid var(--ink);font-weight:500;font-size:13px;white-space:nowrap;letter-spacing:.14em}
.btn-ghost.small{min-height:38px;font-size:13px;align-self:flex-start}
.btn-ghost.danger{border-color:var(--warn);color:var(--warn)}
.btn-text{font-weight:700;color:var(--sea);min-height:44px;font-size:13px}

/* 今日 */
.today{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.resume{display:flex;flex-direction:column;gap:4px;width:100%;padding:18px;border-radius:2px;background:var(--btn-bg);color:var(--btn-ink)}
.resume .eyebrow{color:var(--hit-bg);opacity:1}
.resume b{font-family:var(--f-display);font-size:20px;font-weight:500;letter-spacing:.12em}
.resume-go{margin-top:6px;font-size:12px;font-weight:500;letter-spacing:.2em}

/* 釣行一覧 */
.trips{display:flex;flex-direction:column}
.trip{display:grid;grid-template-columns:84px 1fr auto;gap:12px;align-items:center;width:100%;padding:12px 0;border-bottom:1px solid var(--line)}
.trip:last-child{border-bottom:0}
.trip-main{display:flex;flex-direction:column;min-width:0}
.trip-main b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trip-main span{font-size:12px}
.trip-num{display:flex;flex-direction:column;align-items:flex-end;line-height:1.2}
.trip-num b{font-size:26px;font-weight:300}
.trip-num small{font-size:11px;color:var(--muted)}
.badge-type{font-size:11px;white-space:nowrap;font-weight:500;padding:6px 4px;border:1px solid var(--ink);color:var(--ink);text-align:center;line-height:1.3;letter-spacing:.08em}
.note{border-top:1px solid var(--ink);border-bottom:1px solid var(--line);padding:14px 2px;display:flex;flex-direction:column;gap:8px;font-size:13px}
.note b{font-weight:500;letter-spacing:.1em}

/* 記録中 */
.live-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.live-title{font-family:var(--f-display);font-size:22px;font-weight:500;line-height:1.3;letter-spacing:.12em}
.clock{display:flex;flex-direction:column;align-items:flex-end;line-height:1.1}
.clock b{font-family:var(--f-num);font-size:34px;font-weight:300;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.clock small{font-size:10px;color:var(--muted);letter-spacing:.2em}
.conds{display:flex;flex-wrap:wrap;gap:6px}
.lure-card{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border-top:1px solid var(--ink);border-bottom:1px solid var(--line);padding:12px 2px}
.lure-card>div{min-width:0}
.lure-name{font-weight:500;font-size:16px;letter-spacing:.04em}
.hit{width:100%;min-height:clamp(190px,32vh,290px);border-radius:2px;background:var(--hit-bg);color:var(--hit-ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;
  box-shadow:0 6px 0 var(--hit-deep);transition:transform .08s ease,box-shadow .08s ease;touch-action:manipulation}
.hit:active{transform:translateY(5px);box-shadow:0 1px 0 var(--hit-deep)}
.hit-en{font-family:var(--f-num);font-size:88px;font-weight:400;line-height:1;letter-spacing:.24em;margin-right:-.24em}
.hit-ja{font-size:12px;font-weight:500;letter-spacing:.16em}
.row-btns{display:flex;gap:10px}
.btn-sub{flex:1;min-height:58px;border-radius:2px;background:var(--surface);border:1px solid var(--ink);font-weight:500;font-size:14px;text-align:center;letter-spacing:.14em}
.btn-sub:active{background:var(--sea-soft)}
.score{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.score>div{display:flex;flex-direction:column;align-items:center;padding:12px 4px;line-height:1.2}
.score>div+div{border-left:1px solid var(--line)}
.score b{font-family:var(--f-num);font-size:32px;font-weight:300;font-variant-numeric:tabular-nums}
.score small{font-size:11px;color:var(--muted)}
.log{display:flex;flex-direction:column}
.log-row{display:grid;grid-template-columns:48px 76px 1fr;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;align-items:baseline}
.log-row:last-child{border-bottom:0}
.log-kind{font-weight:700}
.k-hit{color:var(--hit-bg)} .k-bara{color:var(--muted)} .k-sign{color:var(--ink)} .k-change{color:var(--muted)}
.log-detail{min-width:0;overflow-wrap:anywhere}
.btn-end{min-height:52px;border-radius:2px;border:1px solid var(--ink);font-weight:500;font-size:13px;text-align:center;width:100%;letter-spacing:.2em}

/* 振り返り */
.filter{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.filter::-webkit-scrollbar{display:none}
.filter .chip{flex:none;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--surface);border-top:1px solid var(--ink);padding:10px 2px;display:flex;flex-direction:column;line-height:1.25}
.stat b{font-family:var(--f-num);font-size:34px;font-weight:300;font-variant-numeric:tabular-nums}
.stat small{font-size:11px;color:var(--muted)}
.rank{display:flex;flex-direction:column;gap:14px}
.rank-row{display:grid;grid-template-columns:24px 1fr auto;gap:2px 10px;align-items:baseline}
.rank-no{font-family:var(--f-num);color:var(--muted);font-size:13px}
.rank-name{min-width:0;font-weight:700;font-size:14px}
.rank-val{text-align:right;line-height:1.2}
.rank-val b{font-family:var(--f-num);font-size:22px;font-weight:300}
.rank-val small{display:block;font-size:10px;color:var(--muted)}
.rank-sub{grid-column:2/-1;font-size:11px;color:var(--muted)}
.bar{grid-column:2/-1;height:4px;border-radius:2px;background:var(--sea-soft);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--sea);border-radius:2px}
.rank-row.first .bar>i{background:var(--hit-bg)}
.rank-row.thin{opacity:.6}
.hist{display:flex;align-items:flex-end;gap:4px;height:120px;border-bottom:1px solid var(--line)}
.hist .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:2px;min-width:0}
.hist .col span{font-family:var(--f-num);font-size:10px;color:var(--muted)}
.hist .col i{display:block;width:100%;background:var(--sea);border-radius:2px 2px 0 0}
.hist .col.peak i{background:var(--hit-bg)}
.hist-x{display:flex;gap:4px;margin-top:4px}
.hist-x span{flex:1;text-align:center;font-size:10px;color:var(--muted);font-family:var(--f-num);min-width:0}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11px;color:var(--muted);font-weight:700;text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}

/* タックル */
.tk-group{display:flex;flex-direction:column}
.tk-head{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:6px;border-bottom:1px solid var(--ink)}
.tk-row{display:grid;grid-template-columns:52px 1fr auto;gap:4px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.tk-row:last-child{border-bottom:0}
.tk-row>div{min-width:0}
.tk-name{font-weight:700}
.tk-meta{font-size:12px;color:var(--muted)}
.tk-del{font-size:12px;font-weight:700;color:var(--muted);min-height:40px;padding:0 6px}
.tk-del.armed{color:var(--warn)}

/* シート */
.sheet-wrap{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:relative;width:100%;max-width:560px;max-height:90%;overflow:auto;background:var(--surface);border-radius:0;border-top:1px solid var(--ink);
  padding-top:10px;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px));
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 2px;flex:none}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.x{min-width:44px;min-height:44px;font-size:22px;color:var(--muted);text-align:center}
.types{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tile{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-radius:2px;border:1px solid var(--line);min-height:64px;justify-content:center}
.tile:last-child{grid-column:1/-1}
.tile b{font-size:15px;font-weight:500;letter-spacing:.08em}
.tile small{font-size:11px;color:var(--muted);letter-spacing:.06em}
.tile[aria-pressed="true"]{border-color:var(--btn-bg);background:var(--btn-bg);color:var(--btn-ink)}
.tile[aria-pressed="true"] small{color:var(--btn-ink);opacity:.7}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 16px;border-radius:2px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:13px;letter-spacing:.06em}
.chip[aria-pressed="true"]{background:var(--btn-bg);color:var(--btn-ink);border-color:var(--btn-bg)}
.group{display:flex;flex-direction:column;gap:8px}
.auto{background:var(--sea-soft);border-radius:2px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.auto-row{display:flex;flex-wrap:wrap;gap:4px 14px;font-weight:700;font-size:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:11px;letter-spacing:.1em;font-weight:700;color:var(--muted)}
input,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:2px;padding:12px 14px;width:100%}
textarea{min-height:84px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--warn);font-size:13px;font-weight:700}
.lure-list{display:flex;flex-direction:column;gap:8px}
.lure-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px;border-radius:2px;border:1px solid var(--line);min-height:56px}
.lure-row[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.hit-done{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;text-align:center}
.hit-done b{font-family:var(--f-num);font-size:48px;font-weight:300;color:var(--hit-bg);line-height:1.1;font-variant-numeric:tabular-nums}
.stepper{display:grid;grid-template-columns:1fr 1fr 1.4fr 1fr 1fr;gap:6px;align-items:center}
.stepper button{min-height:52px;border-radius:2px;border:1px solid var(--line);font-weight:400;font-family:var(--f-num);font-size:17px;text-align:center}
.stepper b{text-align:center;font-family:var(--f-num);font-size:38px;font-weight:300}
.compare{display:flex;justify-content:space-between;align-items:baseline;padding:10px 14px;border-radius:2px;background:var(--sea-soft)}
.compare b{font-family:var(--f-num);font-size:30px;font-weight:300;color:var(--ink)}

/* タブ */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabs-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted);position:relative}
.tab svg{width:22px;height:22px}
.tab{letter-spacing:.08em;font-weight:500}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"]::after{content:"";position:absolute;top:0;left:30%;right:30%;height:2px;background:var(--ink)}
.tab .dot{position:absolute;top:10px;right:calc(50% - 18px);width:8px;height:8px;border-radius:50%;background:var(--hit-bg)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:30;
  background:var(--btn-bg);color:var(--btn-ink);font-weight:500;font-size:13px;letter-spacing:.08em;padding:10px 18px;border-radius:2px;max-width:calc(100% - 32px);text-align:center}
/* 昼／夜の切り替え */
.top-r{display:flex;align-items:center;gap:8px}
.theme-btn{display:inline-flex;align-items:center;gap:5px;min-height:36px;padding:0 10px;border:1px solid var(--ink);font-size:11px;font-weight:500;letter-spacing:.14em;margin-bottom:4px}
.theme-btn svg{width:14px;height:14px}
.proto{margin-bottom:4px}

/* シルエット */
.sil{display:inline-block;flex:none;color:var(--ink);line-height:0}
.sil svg{display:block;width:100%;height:auto}
.chip{display:inline-flex;align-items:center;gap:8px}
.chip .sil{width:30px}
.chip[aria-pressed="true"] .sil{color:var(--btn-ink)}
.lure-row{justify-content:flex-start}
.lure-row .sil{width:52px}
.lure-row b{flex:1;min-width:0;font-weight:500}
.tk-row .sil{width:46px}
.lure-card .sil{width:56px}
.lure-main{flex:1;min-width:0}

/* 魚種バナー（写真が入ったら --photo で背景に差し替えできる） */
.banners{display:flex;flex-direction:column;gap:8px}
.banner{position:relative;display:grid;grid-template-columns:1fr 46%;align-items:center;min-height:100px;padding:14px 0 14px 18px;border-radius:2px;
  background:var(--btn-bg) var(--photo,none) center/cover no-repeat;color:var(--btn-ink);overflow:hidden;text-align:left}
.banner.compact{min-height:76px}
.banner-txt{display:flex;flex-direction:column;gap:3px;min-width:0;position:relative;z-index:1}
.banner-en{font-family:var(--f-num);font-size:10px;letter-spacing:.3em;opacity:.65}
.banner-ja{font-size:19px;font-weight:500;letter-spacing:.1em;line-height:1.3;word-break:keep-all}
.banner-lure{display:block;width:44px;color:var(--hit-bg);margin-top:6px;line-height:0}
.banner-lure svg,.banner-fish svg{display:block;width:100%;height:auto}
.banner-fish{justify-self:end;width:112%;margin-right:-6%;opacity:.95}
.banner[aria-pressed="true"]{box-shadow:inset 5px 0 0 var(--hit-bg)}
.banner:active{opacity:.88}
.banner-blurb{font-size:11px;letter-spacing:.06em;opacity:.75}
/* フィールド切り替え（海・船／海・陸／淡水） */
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--ink)}
.seg-btn{min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-weight:500;font-size:14px;letter-spacing:.08em;text-align:center}
.seg-btn small{font-family:var(--f-num);font-size:9px;letter-spacing:.2em;opacity:.6}
.seg-btn+.seg-btn{border-left:1px solid var(--ink)}
.seg-btn[aria-pressed="true"]{background:var(--btn-bg);color:var(--btn-ink)}
.seg-btn[aria-pressed="true"] small{opacity:.8}
/* 写真入りバナー：写真の上はテーマに関係なく白文字。左側を暗くして文字を読みやすく */

/* バナー：o={act,key,val,en,label,blurb,cat,fish,photo,sel,compact,lead} */
function bannerHtml(o){
  const ph=PHOTO[o.photo];
  return `<button class="banner${o.compact?' compact':''}${o.lead?' lead':''}${ph?' has-photo':''}"${ph?` style="--photo:url('${ph}')"`:''} data-act="${o.act}" data-${o.key}="${o.val}" aria-pressed="${!!o.sel}">
    <span class="banner-txt">${o.lead?`<span class="banner-lead">${o.lead}</span>`:''}<span class="banner-en">${o.en}</span><span class="banner-ja">${o.label}</span>${o.compact||!o.blurb?'':`<span class="banner-blurb">${o.blurb}</span>`}<span class="banner-lure">${svgOf('0 0 64 24',LURE_SIL[o.cat]||'')}</span></span>
    <span class="banner-fish">${svgOf('0 0 200 80',FISH_SIL[o.fish]||FISH_SIL.trout)}</span></button>`;
}
const spBanner=(s,extra)=>bannerHtml({act:'start-sp',key:'s',val:s.id,en:s.en,label:s.label,blurb:s.blurb,cat:TYPES[s.types[0]].cats[0],fish:s.fish,photo:s.photo,...extra});

const pad=n=>String(n).padStart(2,'0');
const WD='日月火水木金土';
const hm=t=>{const d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes());};
const dateLabel=t=>{const d=new Date(t);return `${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()}（${WD[d.getDay()]}）`;};
const dur=ms=>{const m=Math.max(0,Math.round(ms/60000));return Math.floor(m/60)+':'+pad(m%60);};
const uid=()=>Math.random().toString(36).slice(2,10);
const r1=x=>(Math.round(x*10)/10).toFixed(1);

/* 月齢と潮名（旧暦の日からの概算） */
function moonAge(d){const ref=Date.UTC(2000,0,6,18,14),syn=29.530588853;let a=((d.getTime()-ref)/86400000)%syn;if(a<0)a+=syn;return a;}

    ['buri',[2026,9,27],5,30,7,'丹後',['j1','j2','j1','j3']],
    ['buri',[2026,10,11],5,30,7.5,'丹後',['j3','j1','j2']],
    ['sawara',[2026,10,4],6,0,6,'大阪湾',['b2','b1','b3']],
    ['sawara',[2026,10,18],6,0,6,'大阪湾',['b1','b3','b2','b1']],
    ['trout',[2026,10,13],8,0,7,'高島 泉',['s3','s2','s1','s2']],
    ['tip',[2026,10,5],7,0,6,'丹後',['e1','e2','e1']],
    ['metal',[2026,8,22],18,30,5,'丹後',['m1','m2']],
    ['metal',[2026,9,6],18,30,5,'丹後',['m2','m1','m2']],
  ];
  const trips=plan.map((p,i)=>{
    const r=rng(17+i*101);const [type,[y,m,d],h,mi,hrs,spot,lures]=p;const TY=TYPES[type];
    const start=new Date(y,m-1,d,h,mi).getTime(),end=start+hrs*3600000,seg=(end-start)/lures.length,ev=[];
    lures.forEach((lid,k)=>{
      const s0=start+k*seg;ev.push({id:uid(),t:s0,kind:'change',lure:lid});
      const n=Math.round(power[lid]*seg/3600000*(0.5+r())*(TY.boat?0.6:1));
      for(let j=0;j<n;j++){const f={};TY.fields.forEach(fd=>{f[fd.k]=fd.opts[Math.floor(r()*fd.opts.length)];});
        ev.push({id:uid(),t:s0+60000+r()*(seg-120000),kind:r()<0.15?'bara':'hit',lure:lid,f});}
    });
    if(TY.signs.length)ev.push({id:uid(),t:start+r()*(end-start)*0.6,kind:'sign',label:TY.signs[0]});
    ev.sort((a,b)=>a.t-b.t);
    const mine=ev.filter(e=>e.kind==='hit').length;
    return {id:'sample'+i,sample:true,type,spot,boat:TY.boat?'（サンプル）丸':'',start,end,
      weather:WEATHER[Math.floor(r()*3)],wind:WIND[Math.floor(r()*3)],tide:tideName(new Date(start)),moon:+r1(moonAge(new Date(start))),
      events:ev,boatTotal:TY.boat?mine+Math.round(mine*(2+r()*4))+2:null,memo:''};
  });
  return {tackle,trips,active:null,lastLure:{},lastSpot:{},lastBoat:{}};
}

function evLabel(e,TY){return e.kind==='hit'?(TY.quick?'+'+(e.n||1)+'匹':TY.hitWord):e.kind==='bara'?'バラシ':e.kind==='sign'?e.label:'チェンジ';}

/* ===== 画面：振り返り ===== */
function vReview(){
  const done=S.trips.filter(t=>t.end);
  const types=Object.keys(TYPES).filter(k=>done.some(t=>t.type===k));
  if(!types.length)return `<div class="card"><h2>まだ振り返る記録がありません</h2><p class="muted">釣行を1回終えると、ルアーごとの釣れ方がここに出ます。</p></div>`;
  const ty=types.includes(UI.reviewType)?UI.reviewType:types[0],TY=TYPES[ty],ts=done.filter(t=>t.type===ty);
  const hrs=ts.reduce((a,t)=>a+hoursOf(t),0),hits=ts.reduce((a,t)=>a+count(t,'hit'),0);
  const withBoat=ts.filter(t=>t.boatTotal);const mineB=withBoat.reduce((a,t)=>a+count(t,'hit'),0),boatB=withBoat.reduce((a,t)=>a+t.boatTotal,0);
  // ルアー別：使った時間とヒット
  const agg={};
  ts.forEach(t=>{const ch=t.events.filter(e=>e.kind==='change');
    ch.forEach((e,i)=>{const next=i+1<ch.length?ch[i+1].t:t.end;const k=e.lure||'_none';(agg[k]=agg[k]||{ms:0,hits:0}).ms+=Math.max(0,next-e.t);});
    t.events.filter(e=>e.kind==='hit').forEach(e=>{const k=e.lure||'_none';(agg[k]=agg[k]||{ms:0,hits:0}).hits+=(e.n||1);});});
  const rows=Object.entries(agg).map(([id,v])=>({id,...v,h:v.ms/3600000,rate:v.ms>0?v.hits/(v.ms/3600000):0,thin:v.ms<30*60000}))
    .sort((a,b)=>(a.thin-b.thin)||(b.rate-a.rate));
  const maxRate=Math.max(...rows.map(r=>r.rate),0.01);
  const rank=rows.map((r,i)=>`<div class="rank-row${i===0&&!r.thin?' first':''}${r.thin?' thin':''}"><span class="rank-no">${i+1}</span>
    <span class="rank-name">${esc(lureText(lureById(r.id==='_none'?null:r.id)))}</span>
    <span class="rank-val"><b>${r1(r.rate)}</b><small>本／時間</small></span>
    <span class="rank-sub">${r.hits}本 ・ 使った時間 ${dur(r.ms)}${r.thin?' ・ 時間が短いので参考値':''}</span>
    <span class="bar"><i style="width:${(r.rate/maxRate*100).toFixed(1)}%"></i></span></div>`).join('');
  // 時間帯
  const sH=Math.min(...ts.map(t=>new Date(t.start).getHours())),eH=Math.max(...ts.map(t=>{const d=new Date(t.end);return d.getMinutes()>0?d.getHours():d.getHours()-1;}));
  const byH={};ts.forEach(t=>t.events.filter(e=>e.kind==='hit').forEach(e=>{const h=new Date(e.t).getHours();byH[h]=(byH[h]||0)+(e.n||1);}));
  const hours=[];for(let h=sH;h<=Math.max(sH,eH);h++)hours.push(h);
  const maxH=Math.max(1,...hours.map(h=>byH[h]||0));
  const hist=`<div class="hist">${hours.map(h=>{const n=byH[h]||0;return `<div class="col${n===maxH&&n>0?' peak':''}"><span>${n||''}</span><i style="height:${(n/maxH*100).toFixed(1)}%"></i></div>`;}).join('')}</div>
    <div class="hist-x">${hours.map(h=>`<span>${h}</span>`).join('')}</div>`;
  // 潮
  let tide='';
  if(TY.sea){const g={};ts.forEach(t=>{const x=g[t.tide]=g[t.tide]||{n:0,h:0,hits:0};x.n++;x.h+=hoursOf(t);x.hits+=count(t,'hit');});
    tide=`<section class="card">${secHead('TIDE','潮まわり別')}<div class="tbl-wrap"><table><thead><tr><th>潮</th><th>釣行</th><th>時間</th><th>ヒット</th><th>1時間あたり</th></tr></thead><tbody>${
      Object.entries(g).sort((a,b)=>b[1].hits/b[1].h-a[1].hits/a[1].h).map(([k,x])=>`<tr><td>${k}</td><td>${x.n}</td><td>${r1(x.h)}</td><td>${x.hits}</td><td><b>${r1(x.hits/x.h)}</b></td></tr>`).join('')
    }</tbody></table></div><p class="hint">潮名は日付からの概算です。本番では満潮・干潮の時刻も入れて「潮が動き出してから何分で釣れたか」まで見ます。</p></section>`;}
  return `<div class="stack">
    <div class="filter">${types.map(k=>`<button class="chip" data-act="review-type" data-t="${k}" aria-pressed="${k===ty}">${TYPES[k].label}</button>`).join('')}</div>
    <div class="stats">
      <div class="stat"><b>${ts.length}</b><small>釣行</small></div>
      <div class="stat"><b>${hits}</b><small>${TY.hitWord}（${r1(hrs)}時間）</small></div>
      <div class="stat"><b>${r1(hits/Math.max(hrs,0.25))}</b><small>1時間あたり</small></div>
      <div class="stat"><b>${boatB?Math.round(mineB/boatB*100)+'%':'—'}</b><small>${TY.boat?'船中比（自分÷船全体）':'船中比（船釣りのみ）'}</small></div>
    </div>
    <section class="card">${secHead('RANKING','当たり'+CATS[TY.cats[0]].label)}<p class="hint">投げた回数が多いルアーほど釣れて見えるので、使った時間あたりの本数で比べています。</p><div class="rank">${rank}</div></section>
    <section class="card">${secHead('TIME','時間帯別のヒット')}${hist}</section>
    ${tide}
    <div class="note"><b>お店で買えるようにする（第3段階）</b><p class="muted">このランキングから釣具店の商品ページへ進める予定です。順位は広告で変えない作りにします。</p></div>
  </div>`;
}

  const tr=activeTrip();if(!tr)return null;const TY=TYPES[tr.type],cur=currentLureId(tr);
  const ls=S.tackle.filter(l=>TY.cats.includes(l.cat));
  return `<div class="grab"></div><div class="sheet-head"><h2>${CATS[TY.cats[0]].label}をチェンジ</h2><button class="x" data-act="sheet-close" aria-label="閉じる">×</button></div>
    <div class="lure-list">${ls.map(l=>`<button class="lure-row" data-act="pick-lure" data-id="${l.id}" aria-pressed="${l.id===cur}">${lureSil(l.cat)}<b>${esc(lureText(l))}</b><small class="muted">${esc(l.maker||'')}</small></button>`).join('')||'<p class="muted">まだ登録がありません。</p>'}</div>
    <button class="btn-ghost" data-act="tackle-add-open" data-c="${TY.cats[0]}" data-ret="change">＋ 新しく登録して使う</button>`;
}
function sheetTackleAdd(){
  const d=UI.sheet.d;
  return `<div class="grab"></div><div class="sheet-head"><h2>ルアーを登録</h2><button class="x" data-act="sheet-close" aria-label="閉じる">×</button></div>
    <div class="group"><span class="eyebrow">種類</span><div class="chips">${Object.entries(CATS).map(([c,i])=>`<button class="chip" data-act="tk-cat" data-c="${c}" aria-pressed="${d.cat===c}">${lureSil(c)}${i.label}</button>`).join('')}</div></div>
    <div class="field"><label for="in-maker">メーカー</label><input id="in-maker" value="${esc(d.maker)}" placeholder="例：メーカー名"></div>
    <div class="field"><label for="in-name">商品名</label><input id="in-name" value="${esc(d.name)}" placeholder="例：商品名"></div>
    <div class="two"><div class="field"><label for="in-weight">重さ（${CATS[d.cat].unit}）</label><input id="in-weight" type="number" inputmode="decimal" value="${esc(d.weight)}"></div>
      <div class="field"><label for="in-color">カラー</label><input id="in-color" value="${esc(d.color)}" placeholder="例：ピンク"></div></div>
    ${d.err?`<p class="err">${d.err}</p>`:''}
    <button class="btn-primary" data-act="tackle-save">登録する</button>`;
}
function sheetEnd(){
  const tr=activeTrip();if(!tr)return null;const TY=TYPES[tr.type],d=UI.sheet.d,mine=count(tr,'hit');
  return `<div class="grab"></div><div class="sheet-head"><h2>釣行を終える</h2><button class="x" data-act="sheet-close" aria-label="閉じる">×</button></div>
    <div class="compare"><span>自分の${TY.hitWord}</span><b>${mine}</b></div>
    ${TY.boat?`<div class="group"><span class="eyebrow">船中（船全体の釣果）</span><div class="stepper"><button data-act="boat" data-n="-5">−5</button><button data-act="boat" data-n="-1">−1</button><b>${d.boat}</b><button data-act="boat" data-n="1">+1</button><button data-act="boat" data-n="5">+5</button></div>
      <p class="hint">船長の釣果報告の数でOKです。「みんな釣れなかった日」と「自分だけ釣れなかった日」を分けて見られます。${d.boat>0?`この日の船中比は <b>${Math.round(mine/d.boat*100)}%</b>。`:''}</p></div>`:''}
    <div class="field"><label for="in-memo">ひとことメモ（任意）</label><textarea id="in-memo" placeholder="例：朝イチだけ反応、潮が止まってから沈黙">${esc(d.memo)}</textarea></div>
    <button class="btn-primary" data-act="end-go">終了して保存</button>`;
}
function sheetTrip(){
  const t=S.trips.find(x=>x.id===UI.sheet.id);if(!t)return null;const TY=TYPES[t.type],mine=count(t,'hit');
  return `<div class="grab"></div><div class="sheet-head"><div><span class="eyebrow">${TY.label}</span><h2>${esc(t.spot||'場所未入力')}${t.sample?'<span class="tag">サンプル</span>':''}</h2></div><button class="x" data-act="sheet-close" aria-label="閉じる">×</button></div>
    <p class="muted">${dateLabel(t.start)} <span class="num">${hm(t.start)}–${hm(t.end)}</span>${t.boat?' · '+esc(t.boat):''}</p>
    <div class="conds">${TY.sea?`<span class="pill">${t.tide}</span><span class="pill">月齢 ${t.moon}</span>`:''}${t.weather?`<span class="pill">${t.weather}</span>`:''}${t.wind?`<span class="pill">風 ${t.wind}</span>`:''}</div>
    <div class="score"><div><b>${mine}</b><small>ヒット</small></div><div><b>${r1(mine/Math.max(hoursOf(t),0.25))}</b><small>1時間あたり</small></div><div><b>${t.boatTotal?Math.round(mine/t.boatTotal*100)+'%':'—'}</b><small>${t.boatTotal?'船中 '+t.boatTotal+'本中':'船中比'}</small></div></div>
    <div class="log">${t.events.map(e=>`<div class="log-row"><span class="num muted">${hm(e.t)}</span><span class="log-kind k-${e.kind}">${esc(evLabel(e,TY))}</span><span class="log-detail">${evDetail(e)}</span></div>`).join('')}</div>
    ${t.memo?`<div class="note">${esc(t.memo)}</div>`:''}
    <button class="btn-ghost danger small" data-act="trip-del" data-id="${t.id}">${UI.confirm==='trip-'+t.id?'もう一度押すと削除します':'この釣行を削除'}</button>`;
}

function renderSheet(){
  const wrap=$('#sheet');if(!UI.sheet){wrap.hidden=true;return;}
  const k=UI.sheet.kind;
  const html=k==='start'?sheetStart():k==='hit'?sheetHit():k==='change'?sheetChange():k==='tackle'?sheetTackleAdd():k==='end'?sheetEnd():k==='trip'?sheetTrip():null;
  if(html==null){UI.sheet=null;wrap.hidden=true;return;}
  const body=$('#sheet-body');const st=body.scrollTop;body.innerHTML=html;body.scrollTop=st;wrap.hidden=false;
}
function openSheet(s){UI.sheet=s;renderSheet();$('#sheet-body').scrollTop=0;}
function syncInputs(){
  if(!UI.sheet)return;const v=id=>{const el=document.getElementById(id);return el?el.value:undefined;};
  const k=UI.sheet.kind,d=UI.sheet.d;
  if(k==='start'&&d.type){if(v('in-spot')!==undefined)d.spot=v('in-spot');if(v('in-boat')!==undefined)d.boat=v('in-boat');}
  if(k==='tackle'){['maker','name','weight','color'].forEach(f=>{const x=v('in-'+f);if(x!==undefined)d[f]=x;});}
  if(k==='end'){const x=v('in-memo');if(x!==undefined)d.memo=x;}
  if(k==='hit'){const tr=activeTrip();const ev=tr&&tr.events.find(e=>e.id===UI.sheet.ev);const x=v('in-size');if(ev&&x!==undefined){ev.size=x.trim();save();}}
}
function closeSheet(){syncInputs();UI.sheet=null;renderSheet();render();}

/* ===== 全体の描画 ===== */
function render(){
  const v=UI.view;
  $('#view').innerHTML=v==='home'?vHome():v==='live'?vLive():v==='review'?vReview():vTackle();
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-current',b.dataset.v===v?'page':'false'));
  $('#live-dot').hidden=!activeTrip();
}
let tt;function toast(m){const el=$('#toast');el.textContent=m;el.hidden=false;clearTimeout(tt);tt=setTimeout(()=>{el.hidden=true;},2200);}
let ct;function arm(key){UI.confirm=key;clearTimeout(ct);ct=setTimeout(()=>{UI.confirm=null;render();if(UI.sheet)renderSheet();},4000);}

/* 釣行中は画面を消さない（できる端末のみ） */
let wl=null;
async function wake(){try{if(activeTrip()&&!wl&&'wakeLock' in navigator){wl=await navigator.wakeLock.request('screen');wl.addEventListener&&wl.addEventListener('release',()=>{wl=null;});}}catch(e){wl=null;}}
function unwake(){try{wl&&wl.release();}catch(e){}wl=null;}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')wake();});

/* ===== 昼／夜の切り替え（この端末に記憶） ===== */
const THEME_KEY='choka-theme';
const SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>';
const MOON='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg>';
function curTheme(){const t=document.documentElement.getAttribute('data-theme');if(t==='dark'||t==='light')return t;return window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}
function applyTheme(t){document.documentElement.setAttribute('data-theme',t);const b=document.getElementById('theme-btn');if(b){b.innerHTML=t==='dark'?MOON+'<span>夜</span>':SUN+'<span>昼</span>';b.setAttribute('aria-label',t==='dark'?'いまは夜モード。押すと昼モード':'いまは昼モード。押すと夜モード');}}
try{const s=localStorage.getItem(THEME_KEY);if(s==='dark'||s==='light')document.documentElement.setAttribute('data-theme',s);}catch(e){}

/* ===== 操作 ===== */
const ACT={
  'tab':d=>{UI.view=d.v;render();window.scrollTo(0,0);},
  'start-open':()=>openSheet({kind:'start',d:{field:S.lastField||'boat',sp:null,type:null,spot:'',boat:'',lure:null,weather:null,wind:null}}),
  'start-field':d=>{syncInputs();const sd=UI.sheet.d;if(sd.field!==d.f){sd.field=d.f;sd.sp=null;sd.type=null;}renderSheet();},
  'start-sp':d=>{syncInputs();const sd=UI.sheet.d,s=SPECIES.find(x=>x.id===d.s);if(sd.sp===s.id&&sd.type){return;}sd.sp=s.id;ACT['start-type']({t:(s.types.includes(S.lastTypeBySp?.[s.id])?S.lastTypeBySp[s.id]:s.types[0])});},
  'start-type':d=>{syncInputs();const sd=UI.sheet.d,TY=TYPES[d.t];sd.type=d.t;sd.field=TY.field;sd.sp=TY.sp;sd.spot=S.lastSpot[d.t]??TY.spot;sd.boat=S.lastBoat[d.t]??'';
    const ls=S.tackle.filter(l=>TY.cats.includes(l.cat));sd.lure=ls.some(l=>l.id===S.lastLure[d.t])?S.lastLure[d.t]:(ls[0]?ls[0].id:null);renderSheet();},
  'theme':()=>{const n=curTheme()==='dark'?'light':'dark';applyTheme(n);try{localStorage.setItem(THEME_KEY,n);}catch(e){}toast(n==='dark'?'夜モード：暗い場所で見やすくしました':'昼モード：日差しの下で見やすくしました');},
  'start-with':d=>{ACT['start-open']();ACT['start-type'](d);},
  'start-type-reset':()=>{syncInputs();UI.sheet.d.type=null;UI.sheet.d.sp=null;renderSheet();},
  'sticky':d=>{const tr=activeTrip();if(!tr)return;tr.sticky=tr.sticky||{};tr.sticky[d.k]=tr.sticky[d.k]===d.v?undefined:d.v;save();render();},
  'hit-n':d=>{ACT.hit({n:+d.n});},
  'draft':d=>{syncInputs();const sd=UI.sheet.d;sd[d.k]=(d.k!=='lure'&&sd[d.k]===d.v)?null:d.v;renderSheet();},
  'start-go':()=>{syncInputs();const sd=UI.sheet.d,now=Date.now();
    const tr={id:uid(),type:sd.type,spot:(sd.spot||'').trim(),boat:(sd.boat||'').trim(),start:now,end:null,weather:sd.weather,wind:sd.wind,
      tide:tideName(new Date(now)),moon:+r1(moonAge(new Date(now))),events:[{id:uid(),t:now,kind:'change',lure:sd.lure}],boatTotal:null,memo:''};
    S.trips.push(tr);S.active=tr.id;S.lastSpot[sd.type]=tr.spot;S.lastField=TYPES[sd.type].field;S.lastTypeBySp=S.lastTypeBySp||{};S.lastTypeBySp[TYPES[sd.type].sp]=sd.type;S.lastBoat[sd.type]=tr.boat;if(sd.lure)S.lastLure[sd.type]=sd.lure;save();
    UI.sheet=null;renderSheet();UI.view='live';render();window.scrollTo(0,0);wake();toast('スタートしました。いい釣りを！');},
  'hit':d=>{const tr=activeTrip();if(!tr)return;const TY=TYPES[tr.type];const n=(d&&+d.n)||1;
    const ev={id:uid(),t:Date.now(),kind:'hit',lure:currentLureId(tr),f:TY.quick?{...(tr.sticky||{})}:{}};if(n>1)ev.n=n;tr.events.push(ev);save();
    try{navigator.vibrate&&navigator.vibrate(TY.quick?30:80);}catch(e){}render();
    if(TY.quick){toast('+'+n+'匹　合計 '+count(tr,'hit')+'匹');}else{openSheet({kind:'hit',ev:ev.id});}},
  'bara':()=>{const tr=activeTrip();if(!tr)return;tr.events.push({id:uid(),t:Date.now(),kind:'bara',lure:currentLureId(tr),f:{}});save();render();toast('バラシを記録 '+hm(Date.now()));},
  'sign':d=>{const tr=activeTrip();if(!tr)return;tr.events.push({id:uid(),t:Date.now(),kind:'sign',label:d.label});save();render();toast(d.label+' を記録 '+hm(Date.now()));},
  'hit-f':d=>{syncInputs();const tr=activeTrip();const ev=tr&&tr.events.find(e=>e.id===UI.sheet.ev);if(!ev)return;ev.f=ev.f||{};ev.f[d.k]=ev.f[d.k]===d.v?undefined:d.v;save();renderSheet();},
  'undo':()=>{const tr=activeTrip();if(!tr)return;for(let i=tr.events.length-1;i>=0;i--){if(tr.events[i].kind!=='change'){const e=tr.events.splice(i,1)[0];save();render();toast(hm(e.t)+'の記録を取り消しました');return;}}},
  'change-open':()=>openSheet({kind:'change'}),
  'pick-lure':d=>{const tr=activeTrip();if(!tr)return;if(currentLureId(tr)!==d.id){tr.events.push({id:uid(),t:Date.now(),kind:'change',lure:d.id});S.lastLure[tr.type]=d.id;save();toast('チェンジ：'+lureText(lureById(d.id)));}
    UI.sheet=null;renderSheet();render();},
  'tackle-add-open':d=>openSheet({kind:'tackle',d:{cat:d.c||'jig',maker:'',name:'',weight:'',color:'',err:'',ret:d.ret||null}}),
  'tk-cat':d=>{syncInputs();UI.sheet.d.cat=d.c;renderSheet();},
  'tackle-save':()=>{syncInputs();const d=UI.sheet.d;if(!d.name.trim()){d.err='商品名を入れてください。';renderSheet();return;}
    const l={id:uid(),cat:d.cat,maker:d.maker.trim(),name:d.name.trim(),weight:d.weight===''?'':+d.weight,color:d.color.trim()};S.tackle.push(l);
    const tr=activeTrip();
    if(d.ret==='change'&&tr&&TYPES[tr.type].cats.includes(l.cat)){tr.events.push({id:uid(),t:Date.now(),kind:'change',lure:l.id});S.lastLure[tr.type]=l.id;save();UI.sheet=null;renderSheet();render();toast('登録して使用中：'+lureText(l));return;}
    save();UI.sheet=null;renderSheet();render();toast('登録しました：'+lureText(l));},
  'tackle-del':d=>{if(UI.confirm!=='tk-'+d.id){arm('tk-'+d.id);render();return;}S.tackle=S.tackle.filter(l=>l.id!==d.id);UI.confirm=null;save();render();toast('削除しました');},
  'end-open':()=>{const tr=activeTrip();if(!tr)return;const mine=count(tr,'hit');openSheet({kind:'end',d:{boat:Math.max(mine,0),memo:''}});},
  'boat':d=>{syncInputs();const tr=activeTrip();const mine=tr?count(tr,'hit'):0;UI.sheet.d.boat=Math.max(mine,UI.sheet.d.boat+ +d.n);renderSheet();},
  'end-go':()=>{syncInputs();const tr=activeTrip();if(!tr)return;const d=UI.sheet.d;tr.end=Date.now();tr.boatTotal=TYPES[tr.type].boat?d.boat:null;tr.memo=(d.memo||'').trim();
    S.active=null;save();unwake();UI.sheet=null;renderSheet();UI.view='home';render();window.scrollTo(0,0);toast('釣行を保存しました。おつかれさまでした');},
  'trip-open':d=>openSheet({kind:'trip',id:d.id}),
  'trip-del':d=>{if(UI.confirm!=='trip-'+d.id){arm('trip-'+d.id);renderSheet();return;}S.trips=S.trips.filter(t=>t.id!==d.id);UI.confirm=null;save();UI.sheet=null;renderSheet();render();toast('削除しました');},
  'review-type':d=>{UI.reviewType=d.t;render();},
  'clear-samples':()=>{if(UI.confirm!=='samples'){arm('samples');render();return;}
    const keep=new Set(S.trips.filter(t=>!t.sample).flatMap(t=>t.events.map(e=>e.lure)));
    S.trips=S.trips.filter(t=>!t.sample);S.tackle=S.tackle.filter(l=>!l.sample||keep.has(l.id));UI.confirm=null;save();render();toast('サンプルを消しました');},
  'sheet-close':()=>closeSheet(),
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const f=ACT[b.dataset.act];if(f)f(b.dataset,b);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&UI.sheet)closeSheet();});
setInterval(()=>{const tr=activeTrip();const el=document.getElementById('elapsed');if(tr&&el)el.textContent=dur(Date.now()-tr.start);},15000);

applyTheme(curTheme());render();wake();
</script>

</body>
</html>
